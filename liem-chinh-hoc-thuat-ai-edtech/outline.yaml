topic: "Liêm chính học thuật và gian lận AI trong nghiên cứu EdTech"
topic_slug: liem-chinh-hoc-thuat-ai-edtech
date: 2026-04-12
context: >
  Bài tập Chương 3 — Nhập môn KHGD (16048). Vai trò: nhà nghiên cứu EdTech.
  Đề xuất phương án trả lời câu hỏi về liêm chính khoa học và gian lận khi sử dụng AI.
  Deadline: 12/4/2026 23:59.

items:
  # === REAL CASES — SINH VIÊN / HỌC VIÊN ===
  - id: case_yang_umn
    name: "Haishan Yang — University of Minnesota (2024–2026)"
    type: real_case
    category: student_disciplinary
    institution: "University of Minnesota"
    year: 2024
    summary: >
      PhD student bị đuổi học vì bị nghi dùng AI trong kỳ thi open-book cấm AI.
      Kiện 4 triệu USD, thua kiện liên bang (10/2025) và thua kháng cáo (2/2026).
    outcome: expelled, lawsuits dismissed
    sources:
      - https://www.mprnews.org/story/2025/01/17/phd-student-says-university-of-minnesota-expelled-him-over-ai-allegation
      - https://minnlawyer.com/2026/02/13/u-of-m-ai-cheating-expulsion-upheld-appeal/

  - id: case_anand_lehigh
    name: "Aryan Anand — Lehigh University (2024)"
    type: real_case
    category: student_disciplinary
    institution: "Lehigh University"
    year: 2024
    summary: >
      Sinh viên thú nhận dùng ChatGPT viết essay xin học bổng toàn phần,
      đồng thời giả mạo giấy tờ (giấy khai tử, hồ sơ thuế, mạo danh hiệu trưởng).
    outcome: expelled
    sources:
      - https://www.universityherald.com/articles/79100/20240709/lehigh-university-expels-student-who-admitted-forging-documents-using-chatgpt.htm

  - id: case_yeshiva_2022
    name: "Multiple students — Yeshiva University (December 2022)"
    type: real_case
    category: student_disciplinary
    institution: "Yeshiva University"
    year: 2022
    summary: >
      Vụ kỷ luật tập thể đầu tiên sau khi ChatGPT ra mắt (30/11/2022).
      Nhiều sinh viên nộp bài thi take-home được ChatGPT viết nguyên văn trong 2 lớp của Prof. Paula Geyh.
    outcome: expelled + suspended + course failure
    sources:
      - https://yucommentator.org/2023/01/students-caught-cheating-using-ai-on-final-academic-integrity-policy-updated/

  - id: case_emory_craver
    name: "Benjamin Craver — Emory University (2024)"
    type: real_case
    category: student_disciplinary
    institution: "Emory University"
    year: 2024
    summary: >
      Sinh viên thắng cuộc thi khởi nghiệp 10.000 USD với sản phẩm AI study-tool (Eightball),
      sau đó bị xác định sản phẩm vi phạm honor code.
    outcome: suspended (Summer + Fall 2024)

  - id: case_umn_system_2024
    name: "188 students — University of Minnesota system-wide (2023–24)"
    type: real_case
    category: institutional_data
    institution: "University of Minnesota"
    year: 2024
    summary: >
      188 sinh viên bị xác định vi phạm liên quan AI trong năm học 2023–24,
      chiếm ~50% tổng số vi phạm học thuật trên campus Twin Cities.
    sources:
      - https://mindingthecampus.org/2025/04/29/umn-expels-student-for-ai-use-yet-faculty-practices-go-unchecked/

  - id: case_sheffield_uk
    name: "University of Sheffield — 92 AI misconduct cases (2023–24)"
    type: real_case
    category: institutional_data
    institution: "University of Sheffield, UK"
    year: 2024
    summary: >
      92 ca nghi gian lận AI trong 2023–24 (tăng từ 6 ca năm trước — tăng ~15x trong 1 năm).
      79 sinh viên bị xử phạt.
    sources:
      - https://www.timeshighereducation.com/news/student-ai-cheating-cases-soar-uk-universities

  - id: case_cuhk_policy
    name: "CUHK — Chính sách đuổi học vì AI (2023)"
    type: real_case
    category: asia_policy
    institution: "Chinese University of Hong Kong"
    year: 2023
    summary: >
      Một trong những trường đầu tiên ở châu Á tuyên bố sẽ đuổi học sinh viên
      bị bắt dùng ChatGPT hoặc công cụ AI — hướng dẫn chính sách cụ thể.
    sources:
      - https://www.scmp.com/yp/discover/news/hong-kong/article/3213450/chinese-university-hong-kong-students-be-expelled-if-caught-using-chatgpt-or-ai-tools-new-guide

  - id: case_false_positive_uk
    name: "False positive cases — UK students wrongly accused (2023–2025)"
    type: real_case
    category: false_positive
    institution: "UK universities (multiple) / Office of the Independent Adjudicator"
    year: 2024
    summary: >
      Sinh viên tự kỷ ám thị (autistic student) bị chấm 0 vì Turnitin flag.
      OIA (July 2024) xử sinh viên thắng kháng cáo — trường không xem xét đúng bằng chứng phong cách viết.
      Sinh viên quốc tế dùng Grammarly bị oan tương tự.
    sources:
      - https://www.timeshighereducation.com/news/students-win-plagiarism-appeals-over-generative-ai-detection-tool
      - https://themarkup.org/machine-learning/2023/08/14/ai-detection-tools-falsely-accuse-international-students-of-cheating

  - id: case_texas_am_2023
    name: "Texas A&M — Instructor fails entire class (May 2023)"
    type: real_case
    category: false_positive
    institution: "Texas A&M University"
    year: 2023
    summary: >
      Giảng viên chấm trượt toàn bộ lớp dựa trên điểm AI detector — vụ oan tập thể đầu tiên.
      Bị đảo ngược sau khi lên báo.
    outcome: reversed after media coverage

  # === REAL CASES — NGHIÊN CỨU / PAPER RETRACTION ===
  - id: case_neurips_2025_hallucinations
    name: "NeurIPS 2025 — 100+ hallucinated citations in 51 papers (2026)"
    type: real_case
    category: research_fraud
    institution: "NeurIPS (top AI conference globally)"
    year: 2026
    summary: >
      GPTZero phân tích 4.000+ bài được chấp nhận tại NeurIPS 2025,
      tìm thấy 100+ trích dẫn bịa đặt (tác giả, tạp chí, DOI không tồn tại) trong 51 bài —
      tất cả đều đã qua peer review 3+ người. Nghịch lý: hội nghị AI hàng đầu thế giới.
    sources:
      - https://fortune.com/2026/01/21/neurips-ai-conferences-research-papers-hallucinations/
      - https://gptzero.me/news/neurips/

  - id: case_hindawi_wiley_retraction
    name: "Hindawi/Wiley — 8.000+ bài retract (2023–2024)"
    type: real_case
    category: research_fraud
    institution: "Hindawi (Wiley subsidiary)"
    year: 2023
    summary: >
      Hindawi thu hồi 8.000+ bài trong 2023, chủ yếu từ paper mills sử dụng AI tạo nội dung.
      Wiley đóng cửa 19 tạp chí, tổng 11.000 bài retract, thiệt hại 35–40 triệu USD.
    sources:
      - https://retractionwatch.com/2023/04/05/wiley-and-hindawi-to-retract-1200-more-papers-for-compromised-peer-review/

  - id: case_ai_phrase_contamination
    name: "AI phrase contamination in published papers (2023–2025)"
    type: real_case
    category: research_fraud
    year: 2024
    summary: >
      Các cụm từ "As an AI language model, I…", "As of my last knowledge update" xuất hiện
      trong 115+ bài trên Google Scholar. Springer rút sách ung thư 119 USD vì có câu AI verbatim.
      Zhang et al. (Surfaces and Interfaces, 2024) và Bader et al. (Radiology Case Reports, 2024) bị retract.
    sources:
      - https://retractionwatch.com/2023/10/06/signs-of-undeclared-chatgpt-use-in-papers-mounting/

  - id: case_gpt_fabricated_papers_hks
    name: "GPT-fabricated papers on Google Scholar (Haider et al., Harvard KSG, 2024)"
    type: real_case
    category: research_fraud
    institution: "Harvard Kennedy School Misinformation Review"
    year: 2024
    summary: >
      Nghiên cứu tìm 139 bài nghi dùng GPT lừa đảo: 19 trong tạp chí indexed,
      89 non-indexed, 12 preprints — đặc biệt về sức khỏe và môi trường.
    doi: "https://misinforeview.hks.harvard.edu/article/gpt-fabricated-scientific-papers-on-google-scholar-key-features-spread-and-implications-for-preempting-evidence-manipulation/"

  - id: case_springer_nature_2024
    name: "Springer Nature — 2.923 bài retract trong 2024"
    type: real_case
    category: research_fraud
    institution: "Springer Nature"
    year: 2024
    summary: >
      Springer Nature thu hồi 2.923 bài trong năm 2024 — kỷ lục.
      Neurosurgical Review tràn ngập manuscript AI-generated.
    sources:
      - https://retractionwatch.com/2025/02/17/springer-nature-journal-retractions-2024/

