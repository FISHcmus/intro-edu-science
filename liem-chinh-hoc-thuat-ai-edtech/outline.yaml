  # === AI DETECTION TOOLS ===
  - id: tool_turnitin_ai
    name: "Turnitin AI Detection"
    type: tool
    launched: "April 2023"
    official_accuracy: "98% (claim); 50% trong WaPo testing"
    false_positive: "~4% sentence-level; 30% higher on ESL writers"
    controversy: "Vanderbilt, Michigan State, Northwestern, UT Austin disabled it (2023)"

  - id: tool_gptzero
    name: "GPTZero"
    type: tool
    creator: "Edward Tian (Princeton)"
    launched: "January 2, 2023"
    method: "Perplexity + burstiness; 7-component proprietary model"
    claimed_fp: "0.24%"
    actual_fp: "61.3% on TOEFL essays (Liang et al. Stanford 2023)"

  - id: tool_watermarking
    name: "LLM Watermarking (Kirchenbauer/Aaronson)"
    type: technical_method
    researchers:
      - "John Kirchenbauer (UMD) — green/red token list (ICML 2023, arXiv 2301.10226)"
      - "Scott Aaronson (UT Austin/OpenAI) — Gumbel softmax, distortion-free"
    status: "Chưa triển khai production tại bất kỳ LLM lớn nào (2025)"

  # === ASSESSMENT REDESIGN ===
  - id: assessment_process_based
    name: "Process-based assessment"
    type: prevention_method
    mechanisms: ["staged submissions", "Google Docs revision history", "reflective journals", "annotated bibliography"]
    adopters: ["University of Sydney", "University of Wyoming", "Stanford", "Chartered College of Teaching UK"]

  - id: assessment_oral_defense
    name: "Oral defense / Viva voce"
    type: prevention_method
    adopters: ["University of Sydney", "UC San Diego", "University of Western Ontario"]
    effectiveness: "Cao nhất — không thể giải thích nội dung chưa thực sự học"
    limitation: "Chi phí cao; khó scale; accessibility challenges"

  # === EDTECH COMPANIES ===
  - id: edtech_khan_academy
    name: "Khan Academy — Khanmigo"
