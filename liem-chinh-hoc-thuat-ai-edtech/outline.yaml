  # === FRAMEWORKS & POLICIES ===
  - id: framework_icai_6values
    name: "ICAI — 6 Core Values of Academic Integrity"
    type: framework
    organization: "International Center for Academic Integrity"
    year_founded: 1992
    values: [Honesty, Trust, Fairness, Respect, Responsibility, Courage]
    note: "Courage được thêm vào bản 2014 — hành động theo giá trị dù áp lực"
    url: https://www.academicintegrity.org/

  - id: framework_eaton_postplagiarism
    name: "Postplagiarism Framework (Eaton, 2023)"
    type: framework
    author: "Sarah Elaine Eaton"
    journal: "International Journal for Educational Integrity"
    year: 2023
    doi: https://link.springer.com/article/10.1007/s40979-023-00144-1
    tenets:
      - "Human-AI hybrid writing sẽ trở thành chuẩn mực"
      - "Sáng tạo có thể được nâng cao bởi AI"
      - "AI giúp vượt rào cản ngôn ngữ"
      - "Có thể outsource việc viết cho AI, nhưng không thể outsource trách nhiệm"
      - "Attribution (ghi nguồn) vẫn quan trọng"
      - "Định nghĩa lịch sử về đạo văn cần được định nghĩa lại"

  - id: framework_perkins_aias
    name: "AIAS — AI Assessment Scale (Perkins, BUV)"
    type: framework
    author: "Mike Perkins"
    institution: "British University Vietnam"
    tiers:
      - "Tier 1: AI prohibited (thi, sáng tác gốc)"
      - "Tier 2: AI limited (chỉ research, không viết)"
      - "Tier 3: AI permitted with disclosure (bản nháp AI, công khai)"
      - "Tier 4: AI encouraged (công cụ là một phần bài tập)"
      - "Tier 5: AI integrated (AI co-creation là bài tập)"

  - id: framework_bretag_5elements
    name: "Bretag's 5 Core Elements of Exemplary AI Policy"
    type: framework
    author: "Tracey Bretag"
    year: 2011
    elements: [Access, Approach, Responsibility, Detail, Support]

  - id: policy_unesco_2021
    name: "UNESCO Recommendation on the Ethics of AI (2021)"
    type: policy
    organization: UNESCO
    year: 2021
    adopted_by: "193 member states"
    url: https://unesdoc.unesco.org/ark:/48223/pf0000380455

  - id: policy_unesco_2023
    name: "UNESCO Guidance for Generative AI in Education and Research (2023)"
    type: policy
    organization: UNESCO
    year: 2023
    url: https://unesdoc.unesco.org/ark:/48223/pf0000386693
    key_recommendation: >
      Không cấm hoàn toàn GenAI; hỗ trợ sinh viên sử dụng có đạo đức và minh bạch;
      khuyến nghị giới hạn độ tuổi và bảo vệ dữ liệu riêng tư.

  - id: policy_eu_ai_act
    name: "EU AI Act (Regulation 2024/1689)"
    type: policy
    organization: "European Union"
    year: 2024
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202401689
    education_provisions:
      - "Annex III §3: AI trong GD là high-risk (tuyển sinh, đánh giá, giám sát thi)"
      - "Article 50: AI-generated text phải có disclosure — hiệu lực 2/8/2026"
      - "Article 4: AI literacy bắt buộc cho nhà cung cấp và người dùng"

  - id: policy_acm_ethics
    name: "ACM Code of Ethics and Professional Conduct (2018)"
    type: policy
    organization: "Association for Computing Machinery"
    year: 2018
    url: https://www.acm.org/code-of-ethics
    relevant_sections:
      - "1.3 Be Honest and Trustworthy"
      - "1.2 Avoid Harm"
      - "2.5 Give Comprehensive and Thorough Evaluations"

  - id: policy_ieee_ead
    name: "IEEE Ethically Aligned Design (EAD1e, 2019)"
    type: policy
    organization: "IEEE Global Initiative on Ethics of AI"
    year: 2019
    url: https://engagestandards.ieee.org/rs/211-FYL-955/images/EAD1e.pdf
    principles: [Transparency, Accountability, Human Well-being, Data Agency, Awareness of Misuse]

