categories:
  basic_info:
    display_name: "Basic Info"
    fields:
      - name: name
        description: "Full name of the concept/work/person"
        detail_level: brief
      - name: original_language_title
        description: "Original German title (if applicable)"
        detail_level: brief
      - name: year
        description: "Year of publication/origin"
        detail_level: brief
      - name: type
        description: "Type: book, concept, person, event, movement, method"
        detail_level: brief
      - name: primary_source_text
        description: "The primary text/lecture cycle where this concept appears"
        detail_level: brief
      - name: summary
        description: "One-paragraph summary of the item"
        detail_level: moderate

  anthroposophical_foundation:
    display_name: "Anthroposophical Foundation"
    fields:
      - name: core_claim
        description: "The central philosophical or spiritual claim"
        detail_level: moderate
      - name: spiritual_scientific_basis
        description: "How this concept is grounded in Steiner's spiritual science — supersensible perception, clairvoyant research, Goethean observation"
        detail_level: moderate
      - name: view_of_human_nature
        description: "Steiner's view of human nature as it relates to this item — body-soul-spirit, fourfold body, divine origin"
        detail_level: moderate
      - name: threefold_human_being
        description: "How this item relates to thinking-feeling-willing and nerve-sense/rhythmic/metabolic-limb systems"
        detail_level: moderate
      - name: relationship_to_theosophy
        description: "How this item relates to Steiner's theosophical roots and departure from Blavatsky's Theosophy"
        detail_level: moderate

  educational_principles:
    display_name: "Educational Principles"
    fields:
      - name: pedagogy_method
        description: "The specific pedagogical approach or method"
        detail_level: detailed
      - name: role_of_teacher
        description: "What the teacher should do — artist, healer, authority through love"
        detail_level: moderate
      - name: role_of_student
        description: "What the student is expected to do — active participant, imitator, imaginative learner"
        detail_level: moderate
      - name: curriculum_approach
        description: "What should be taught, when, and how — matched to developmental stage"
        detail_level: detailed
      - name: assessment_method
        description: "How learning is evaluated — narrative reports, ipsative assessment, no grades"
        detail_level: moderate
      - name: artistic_integration
        description: "How artistic activities are woven into academic subjects as cognitive tools"
        detail_level: moderate

  developmental_theory:
    display_name: "Developmental Theory"
    fields:
      - name: target_age_range
        description: "The age range this concept primarily applies to"
        detail_level: brief
      - name: seven_year_cycle
        description: "Which seven-year cycle this maps to and which body is incarnating"
        detail_level: moderate
      - name: key_milestones
        description: "Educational milestones or transitions at this stage"
        detail_level: moderate
      - name: thinking_feeling_willing_balance
        description: "The balance between thinking, feeling, and willing at this developmental stage"
        detail_level: moderate

  historical_context:
    display_name: "Historical Context"
    fields:
      - name: political_context
        description: "Political conditions — post-WWI Germany, Weimar Republic, social upheaval"
        detail_level: moderate
      - name: cultural_context
        description: "Cultural and intellectual milieu — German Idealism, Goethe, Romanticism, Theosophy"
        detail_level: moderate
      - name: intellectual_influences
        description: "Thinkers who influenced Steiner — Goethe, Fichte, Schiller, Blavatsky, Haeckel"
        detail_level: moderate
      - name: immediate_reception
        description: "How this concept was received when first proposed"
        detail_level: detailed

  influence_and_legacy:
    display_name: "Influence & Legacy"
    fields:
      - name: influenced_thinkers
        description: "Specific thinkers or practitioners directly influenced"
        detail_level: detailed
      - name: influenced_movements
        description: "Educational and cultural movements that trace lineage to this concept"
        detail_level: moderate
      - name: modern_applications
        description: "How this concept manifests in 21st-century education"
        detail_level: detailed
      - name: countries_most_affected
        description: "Countries where this concept had the most lasting impact"
        detail_level: moderate

  critiques_and_controversies:
    display_name: "Critiques & Controversies"
    fields:
      - name: scientific_validity
        description: "Critiques of pseudoscience, lack of empirical evidence, unfalsifiable spiritual claims"
        detail_level: detailed
      - name: cult_accusations
        description: "Accusations of cultishness, insularity, dogmatic adherence to Steiner's teachings"
        detail_level: moderate
      - name: racial_concerns
        description: "Problematic racial hierarchy statements in Steiner's lectures; how modern Waldorf addresses this"
        detail_level: detailed
      - name: practical_feasibility
        description: "Can this work at scale? Cost, teacher training requirements, transition to mainstream"
        detail_level: moderate
      - name: internal_contradictions
        description: "Contradictions within Steiner's philosophy or between theory and practice"
        detail_level: moderate

  comparative_analysis:
    display_name: "Comparative Analysis"
    fields:
      - name: comparison_with_montessori
        description: "Waldorf vs. Montessori — both alternative, but fundamentally different in approach to materials, structure, spirituality"
        detail_level: detailed
      - name: comparison_with_rousseau
        description: "How this compares with Rousseau's natural education — nature, developmental stages, delayed instruction"
        detail_level: moderate
      - name: comparison_with_mainstream_education
        description: "How this differs from conventional state education — testing, curriculum, teacher role"
        detail_level: moderate
      - name: comparison_with_confucian_education
        description: "Parallels and divergences with Confucian educational tradition"
        detail_level: moderate

  key_quotes:
    display_name: "Key Quotes"
    fields:
      - name: original_german
        description: "Key quote in original German"
        detail_level: moderate
      - name: english_translation
        description: "English translation of the key quote"
        detail_level: moderate
      - name: vietnamese_translation
        description: "Vietnamese translation of the key quote"
        detail_level: moderate
      - name: context_explanation
        description: "Explanation of the quote's context and significance"
        detail_level: detailed

  vietnamese_relevance:
    display_name: "Vietnamese Relevance"
    fields:
      - name: connections_to_vietnamese_education
        description: "How this concept connects to Vietnamese educational tradition and practice"
        detail_level: detailed
      - name: parallels_with_luat_gd_2019
        description: "Parallels with Luật Giáo dục 2019 (Vietnam Education Law 2019)"
        detail_level: detailed
      - name: relevance_to_chien_luoc_2030
        description: "Relevance to Chiến lược phát triển GD đến 2030 (Education Development Strategy to 2030)"
        detail_level: detailed

uncertain: []
